[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 10_000
via_ir = false
remappings = [
  "@chainlink/contracts/=lib/chainlink-brownie-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]
fs_permissions = [{ access = "write", path = "./frontend" }]

[fuzz]
runs = 1000

[invariant]
runs = 128
depth = 64
fail_on_revert = false

[fmt]
line_length = 120

[lint]
# Rounds last minutes-to-days, so validator timestamp drift (~seconds) is irrelevant here.
exclude_lints = ["block-timestamp"]
